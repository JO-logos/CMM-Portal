        <form class="cmm-login-form" action="#" method="post" data-cmm-login-form>
          <h2 class="cmm-login-form__title">Member Login</h2>

          <label class="cmm-login-screen-reader-only" for="cmm-login-email">Email</label>
          <input class="cmm-login-field" id="cmm-login-email" name="login" type="email" autocomplete="username" placeholder="Email" required>

          <label class="cmm-login-screen-reader-only" for="cmm-login-password">Password</label>
          <div class="cmm-login-password" data-cmm-password-control>
            <input class="cmm-login-field cmm-login-password__field" id="cmm-login-password" name="password" type="password" autocomplete="current-password" placeholder="Password" required data-cmm-password-field>
            <button class="cmm-login-password__toggle" type="button" data-cmm-password-toggle aria-controls="cmm-login-password" aria-pressed="false">Show</button>
          </div>
          <p class="cmm-login-form__note" data-cmm-caps-lock hidden>Caps Lock is on.</p>

          <p class="cmm-login-form__status" data-cmm-login-status role="status" hidden></p>
          <button class="cmm-login-submit" type="submit" data-cmm-login-submit>Log In</button>

          <nav class="cmm-login-help" aria-label="Login help">
            <a class="cmm-login-help__link" href="#">Reset Password</a>
            <p class="cmm-login-help__signup">Don’t have an account? <a class="cmm-login-help__link" href="signup.html">Create an account</a></p>
          </nav>
        </form>
