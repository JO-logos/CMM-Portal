        <main class="cmm-main" id="main-content" tabindex="-1">
          <div class="cmm-page-layout cmm-page--document-center">
            <header class="cmm-page-header">
              <h1 class="cmm-page-header__title">Document Center</h1>
              <p class="cmm-page-header__summary">View signed agreements, member notices, and other important account documents.</p>
            </header>

            <!-- Future QWeb mapping: cmm_member_portal.document_center -->
            <section class="cmm-data-section cmm-document-center-list" aria-labelledby="document-list-title">
              <h2 class="cmm-screen-reader-only" id="document-list-title">Account documents</h2>
              <div class="cmm-data-card">
                <table class="cmm-data-table cmm-document-table">
                  <caption class="cmm-screen-reader-only">Signed account documents</caption>
                  <thead>
                    <tr>
                      <th scope="col">Document</th>
                      <th scope="col">Date Signed</th>
                      <th scope="col">Action</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr>
                      <td data-label="Document">
                        <a class="cmm-text-link cmm-document-link" href="document-center-detail.html">
                          <svg class="cmm-icon" aria-hidden="true"><use href="../assets/icons/cmm-ui-icons.svg#cmm-icon-document"></use></svg>
                          <span>Member Checklist</span>
                        </a>
                      </td>
                      <td data-label="Date Signed"><time datetime="2026-08-03">2026-08-03</time></td>
                      <td data-label="Action"><a class="cmm-button" href="document-center-detail.html">View</a></td>
                    </tr>
                  </tbody>
                </table>
                <template class="cmm-empty-state-template">
                  <p class="cmm-empty-state">No account documents are available.</p>
                </template>
              </div>
            </section>
          </div>
        </main>
